<!DOCTYPE html>
<html>
<head>
    <title>Doctor Availability</title>

    <style>
    body {
        font-family: Arial, sans-serif;
        background: #f4f5fa;
        color: #111827;
        margin: 0;
        padding: 0;
    }

    table {
        width: 70%;
        margin: 30px auto;
        border-collapse: collapse;
        background: #ffffff;
        border: 1px solid #c7ccd8;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 5px 22px rgba(24, 32, 51, 0.08);
    }

    th {
        padding: 14px 10px;
        text-align: center;
        background: #f7f8fc;
        color: #374151;
        border: 1px solid #c7ccd8;
        font-size: 12px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }

    td {
        padding: 16px 10px;
        text-align: center;
        background: #ffffff;
        color: #374151;
        border: 1px solid #dfe3ea;
        font-size: 13px;
    }

    tr:hover td {
        background: #f7f8fc;
    }

    .slot-box {
        padding: 11px 18px;
        display: inline-block;
        min-width: 150px;
        border: 1.5px solid #9ca3af;
        border-radius: 7px;
        margin-left: 6px;
        cursor: pointer;
        font-size: 12px;
        font-weight: 800;
        transition: 0.15s ease;
    }

    .slot-box.booked {
        background: #fef2f2;
        border-color: #b91c1c;
        color: #b91c1c;
        opacity: 0.7;
        cursor: not-allowed;
    }

    .slot-box.available {
        background: #ecfdf5;
        border-color: #047857;
        color: #047857;
    }

    .slot-box.available:hover {
        background: #d1fae5;
        transform: translateY(-1px);
    }

    input[type="radio"]:checked + .slot-box,
    label input[type="radio"]:checked + .slot-box {
        background: #eef2ff;
        border-color: #4f46e5;
        color: #3730a3;
        box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.12);
    }

    input[type="radio"] {
        display: none;
    }

    .save-btn {
        padding: 10px 18px;
        border: 1px solid #4f46e5;
        background: #4f46e5;
        color: #ffffff;
        cursor: pointer;
        float: right;
        margin-right: 15%;
        margin-bottom: 30px;
        border-radius: 7px;
        font-family: Arial, sans-serif;
        font-size: 12px;
        font-weight: 800;
        transition: 0.15s ease;
    }

    .save-btn:hover {
        background: #3730a3;
        border-color: #3730a3;
        transform: translateY(-1px);
    }

    .save-btn:active {
        transform: translateY(0);
    }
</style>

</head>

<body>

<h2 style="text-align:center;">Doctor Availability</h2>

<form action="{{ url_for('routes.view_doctors_by_patient', dept_id=doctor.department_id) }}" method="get"
      style="position:absolute; top:20px; right:20px;">
    <button style="padding:5px 12px; background:#c0392b; color:white; border:none; border-radius:4px; cursor:pointer;">
        Back
    </button>
</form>

<form method="POST" action="{{ url_for('routes.booking_appointment', doctor_id=doctor.id) }}">

    <table>
        <tr>
            <th>Date</th>
            <th>Morning</th>
            <th>Evening</th>
        </tr>

        {% for d in availabilities %}
        <tr>
            <td>{{ d.date.strftime("%Y-%m-%d") }}</td>

            <!-- morning -->
            <td>
                <label style="cursor:pointer;">
                    <input type="radio"
                           name="slot"
                           value="{{ d.date.strftime('%Y-%m-%d') }}|morning"
                           {% if not d.morning %}disabled{% endif %}>
                    <!-- add available/booked class here -->
                    <div class="slot-box {% if d.morning %}available{% else %}booked{% endif %}">
                        8 AM – 12 PM
                    </div>
                </label>
            </td>

            <!-- evening -->
            <td>
                <label style="cursor:pointer;">
                    <input type="radio"
                           name="slot"
                           value="{{ d.date.strftime('%Y-%m-%d') }}|evening"
                           {% if not d.evening %}disabled{% endif %}>
                    <div class="slot-box {% if d.evening %}available{% else %}booked{% endif %}">
                        4 PM – 9 PM
                    </div>
                </label>
            </td>

        </tr>
        {% endfor %}
    </table>

    <button class="save-btn" type="submit">Book Appointment</button>

</form>

</body>
</html>
