<!DOCTYPE html>
<html>
<head>
    <title>Add Treatment</title>

    <style>
        /* Form container */
.box {
    width: 60%;
    margin: 20px auto;
    padding: 20px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-family: Arial, sans-serif;
}

/* Spacing between form fields */
.form-group {
    margin-bottom: 12px;
}

/* Labels styling */
label {
    display: block;
    font-weight: bold;
    margin-bottom: 4px;
}

/* Input and textarea styling */
input, textarea {
    width: 100%;
    padding: 8px;
    border: 1px solid #ccc;
    border-radius: 4px;
}

/* Read-only field styling */
.readonly {
    background-color: #eee;
}

/* Button styling */
button {
    padding: 8px 16px;
    background-color: #28a745;
    color: #fff;
    border: none;
    border-radius: 4px;
    cursor: pointer;
}

/* Button hover effect */
button:hover {
    background-color: #1e7e34;
}

    </style>
</head>
<body>

<form action="{{ url_for('routes.doctor_dashboard') }}" method="get"
        style="position:absolute; top:20px; right:20px;">
      <button style="padding:5px 12px; background:#c0392b; color:white; border:none;
                     border-radius:4px; cursor:pointer;">
          Back
      </button>
    </form>


<div class="box">
    <h2>Add Treatment</h2>

    <form method="POST">

        <div class="form-group">
            <label>Patient ID</label>
            <input type="text" class="readonly" value="{{ appointment.patient_id }}" readonly>
        </div>

        <div class="form-group">
            <label>Appointment ID</label>
            <input type="text" class="readonly" value="{{ appointment.id }}" readonly>
        </div>

        <div class="form-group">
            <label>Appointment Date</label>
            <input type="text" class="readonly" value="{{ appointment.appointment_date }}" readonly>
        </div>

        <div class="form-group">
            <label>Appointment Time</label>
            <input type="text" class="readonly" value="{{ appointment.appointment_time }}" readonly>
        </div>

        <div class="form-group">
            <label>Visit Number</label>
            <input type="number" name="visit_number" value="{{ visit_number }}" readonly class="readonly">
        </div>

        <div class="form-group">
            <label>Visit Type</label>
            <input type="text" name="visit_type" placeholder="Follow-up / First Visit / Routine etc.">
        </div>

        <div class="form-group">
            <label>Diagnosis</label>
            <textarea name="diagnosis_text" rows="3"></textarea>
        </div>

        <div class="form-group">
            <label>Prescription</label>
            <textarea name="prescription" rows="3"></textarea>
        </div>

        <div class="form-group">
            <label>Medicines</label>
            <textarea name="medicines" rows="3"></textarea>
        </div>

        <button type="submit">Add Treatment</button>
    </form>
</div>

</body>
</html>
