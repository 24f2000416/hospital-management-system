{% extends "base.html" %}

{% block content %}

<div style="
    width: 400px;
    margin: 40px auto;
    padding: 25px;
    background: white;
    border-radius: 10px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
">

    <h2 style="
        text-align:center;
        margin-bottom:20px;
    ">
        Patient Registration
    </h2>


    <!-- FLASH MESSAGES -->
    {% with messages = get_flashed_messages(with_categories=true) %}

        {% if messages %}

            {% for category, message in messages %}

                <div style="
                    padding: 10px;
                    margin-bottom: 15px;
                    border-radius: 6px;

                    {% if category == 'success' %}
                        background-color: #d4edda;
                        color: #155724;
                        border: 1px solid #c3e6cb;
                    {% else %}
                        background-color: #f8d7da;
                        color: #721c24;
                        border: 1px solid #f5c6cb;
                    {% endif %}
                ">
                    {{ message }}
                </div>

            {% endfor %}

        {% endif %}

    {% endwith %}


    <!-- REGISTRATION FORM -->
    <form
        action="{{ url_for('routes.register') }}"
        method="POST"
        autocomplete="off"
    >

        <!-- USERNAME -->
        <label>Username</label>

        <input
            type="text"
            name="username"
            autocomplete="off"
            required
            style="
                width:100%;
                padding:10px;
                margin:8px 0;
                border:1px solid #ccc;
                border-radius:6px;
                box-sizing:border-box;
            "
        >


        <!-- EMAIL -->
        <label>Email</label>

        <input
            type="email"
            name="email"
            autocomplete="off"
            required
            style="
                width:100%;
                padding:10px;
                margin:8px 0;
                border:1px solid #ccc;
                border-radius:6px;
                box-sizing:border-box;
            "
        >


        <!-- PASSWORD -->
        <label>Password</label>

        <input
            type="password"
            name="password"
            autocomplete="new-password"
            required
            style="
                width:100%;
                padding:10px;
                margin:8px 0;
                border:1px solid #ccc;
                border-radius:6px;
                box-sizing:border-box;
            "
        >


        <!-- PHONE -->
        <label>Phone</label>

        <input
            type="text"
            name="phone"
            autocomplete="off"
            maxlength="10"
            inputmode="numeric"
            style="
                width:100%;
                padding:10px;
                margin:8px 0;
                border:1px solid #ccc;
                border-radius:6px;
                box-sizing:border-box;
            "
        >


        <!-- REGISTER BUTTON -->
        <button
            type="submit"
            style="
                width:100%;
                padding:12px;
                margin-top:10px;
                background:#007bff;
                color:white;
                border:none;
                border-radius:6px;
                cursor:pointer;
                font-size:16px;
            "
        >
            Register
        </button>

    </form>

</div>

{% endblock %}
