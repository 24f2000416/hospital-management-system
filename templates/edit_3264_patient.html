<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Patient | CarePlus</title>

    <style>

        :root {
            --primary: #4f46e5;
            --primary-dark: #3730a3;
            --primary-light: #eef2ff;

            --background: #f4f5fa;
            --surface: #ffffff;
            --surface-alt: #f7f8fc;

            --text: #111827;
            --text-secondary: #374151;
            --text-muted: #667085;

            --border: #c7ccd8;
            --border-light: #dfe3ea;

            --danger: #b91c1c;
            --danger-bg: #fef2f2;

            --shadow: 0 5px 22px rgba(24, 32, 51, 0.08);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family: Arial, sans-serif;

            background: var(--background);
            color: var(--text);

            display: flex;
            justify-content: center;
            align-items: flex-start;

            padding: 45px 20px;
        }

        .container {
            width: 450px;
            max-width: 100%;

            margin: 0 auto;

            background: var(--surface);

            padding: 28px;

            border: 1px solid var(--border);
            border-radius: 12px;

            box-shadow: var(--shadow);
        }

        .form-header {
            text-align: center;
            margin-bottom: 22px;
        }

        .page-label {
            display: inline-block;

            padding: 6px 10px;
            margin-bottom: 10px;

            background: var(--primary-light);
            color: var(--primary);

            border: 1px solid #d8dcf5;
            border-radius: 6px;

            font-size: 10px;
            font-weight: 800;

            letter-spacing: 0.8px;
            text-transform: uppercase;
        }

        h3 {
            text-align: center;

            margin: 0;

            color: var(--text);

            font-size: 23px;
            font-weight: 800;
        }

        .form-subtitle {
            margin: 7px 0 0;

            color: var(--text-muted);

            font-size: 11px;
            line-height: 1.5;
        }

        .divider {
            height: 1px;

            background: var(--border-light);

            margin: 22px 0;
        }

        .form-group {
            margin-bottom: 17px;
        }

        label {
            display: block;

            margin-bottom: 7px;

            color: var(--text-secondary);

            font-size: 11px;
            font-weight: 800;
        }

        input,
        select {
            width: 100%;

            padding: 11px 12px;

            box-sizing: border-box;

            background: var(--surface);

            color: var(--text);

            border: 1px solid var(--border);
            border-radius: 7px;

            font-family: Arial, sans-serif;
            font-size: 12px;

            outline: none;

            transition: 0.15s ease;
        }

        input:focus,
        select:focus {
            border-color: var(--primary);

            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.10);
        }

        input:hover,
        select:hover {
            border-color: #9ca3af;
        }

        .btn-box {
            display: flex;
            align-items: center;

            gap: 10px;

            margin-top: 23px;
        }

        .btn {
            flex: 1;

            display: inline-flex;
            align-items: center;
            justify-content: center;

            padding: 11px 15px;

            background: var(--primary);
            color: #ffffff;

            border: 1px solid var(--primary);
            border-radius: 7px;

            font-family: Arial, sans-serif;
            font-size: 11px;
            font-weight: 800;

            cursor: pointer;

            text-decoration: none;

            transition: 0.15s ease;
        }

        .btn:hover {
            background: var(--primary-dark);
            border-color: var(--primary-dark);

            transform: translateY(-1px);
        }

        a {
            flex: 1;

            display: inline-flex;
            align-items: center;
            justify-content: center;

            padding: 11px 15px;

            background: var(--surface);

            color: var(--text-secondary);

            border: 1px solid var(--border);
            border-radius: 7px;

            text-decoration: none;

            font-size: 11px;
            font-weight: 800;

            transition: 0.15s ease;
        }

        a:hover {
            background: var(--surface-alt);
            border-color: #9ca3af;

            transform: translateY(-1px);
        }

        .error {
            background: var(--danger-bg);
            color: var(--danger);

            padding: 10px 12px;

            border: 1px solid #fecaca;
            border-left: 4px solid var(--danger);

            border-radius: 7px;

            text-align: center;

            margin-bottom: 16px;

            font-size: 11px;
            font-weight: 600;
        }

        @media (max-width: 520px) {

            body {
                padding: 25px 15px;
            }

            .container {
                padding: 22px 18px;
            }

            .btn-box {
                flex-direction: column;
            }

            .btn,
            a {
                width: 100%;
            }
        }

    </style>

</head>

<body>

    <div class="container">

        <div class="form-header">

            <div class="page-label">
                CarePlus Admin
            </div>

            <h3>
                Edit Patient
            </h3>

            <p class="form-subtitle">
                Update the patient's account information.
            </p>

        </div>

        <div class="divider"></div>

        <form method="POST" action="{{ url_for('routes.edit_3264_patient',patient_id=patient.id) }}">

            <div class="form-group">

            </div>

            <div class="form-group">

                <label for="username">
                    Patient Name:
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    value="{{patient.username}}"
                    required
                >

            </div>

            <div class="form-group">

                <label for="email">
                    Email:
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                    value="{{patient.email}}"
                >

            </div>

            <div class="form-group">

                <label for="password">
                    Password:
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    
                    
                >

            </div>

            <div class="form-group">

                <label for="phone">
                    Phone:
                </label>

                <input
                    type="text"
                    id="phone"
                    name="phone"
                    value="{{patient.phone}}"
                    required
                >

            </div>

            <div class="btn-box">

                <button
                    type="submit"
                    class="btn"
                >
                    Save
                </button>

                <a href="{{ url_for('routes.admin_dashboard') }}">
                    Cancel
                </a>

            </div>

        </form>

    </div>

</body>

</html>
