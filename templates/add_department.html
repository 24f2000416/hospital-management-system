<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Department</title>
</head>
<body style="font-family: Arial, sans-serif; background:#f8f9fa;">

  <div style="width:400px; margin:60px auto; background:#fff; padding:20px; border:1px solid #ccc; border-radius:8px;">
    {% if error_message%}
        <div style="background-color:#f8d7da; color:#721c24; padding:10px; border-radius:5px; margin-bottom:15px; text-align:center;">
            {{ error_message }}
        </div>
        {% endif %}
    <h3 style="text-align:center;">Add Department</h3>
    <form method="POST" action="{{ url_for('routes.add_department') }}">
        
        

        <label>Department Name:</label><br>
        <input type="text" name="name" required style="width:100%; padding:6px; margin:6px 0;"><br>

      <label>Description:</label><br>
      <textarea name="description" rows="3" style="width:100%; padding:6px; margin:6px 0;"></textarea><br>

      <button type="submit" style="background:#007bff; color:white; padding:6px 12px; border:none; border-radius:4px;">
        Save
      </button>
      <a href="{{ url_for('routes.admin_dashboard') }}" style="margin-left:10px; color:#007bff;">Cancel</a>
    </form>
  </div>

</body>
</html>
